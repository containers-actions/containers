name: comment-bot
run-name: comment-bot
on:
  issue_comment:
    types:
      - created
permissions: {}
jobs:
  comment-bot:
    name: comment-bot
    if: startsWith(github.event.comment.body, '/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: .github
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install semver js-yaml
      - uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.BOT_PAT }}
          script: |
            require('.github/scripts/comment-bot.js')({ github, context, core, glob, io, exec, require });
